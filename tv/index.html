<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="900">
<title>Rerum · Desmobilização V.tal</title>
<style>
  /* Paleta: mesma familia do painel LME (identidade Rerum, tema escuro de TV).
     Regra de cor: "retirado/coletado" usa SEMPRE o mesmo azul em todo grafico
     (uma entidade = uma cor); verde/ambar/cinza/vermelho sao exclusivos de
     STATUS e vem sempre com rotulo escrito - cor nunca carrega o dado sozinha.
     Tudo em vh/vw: o painel se ajusta de 1366p a 4K sem media query. */
  :root{
    --bg:#0c1a29; --bg2:#0a1623; --panel:#15293d; --panel2:#102234; --line:#26405a;
    --txt:#eef4fb; --muted:#9ab0cc; --red:#d4403a;
    --dado:#4da3ff;                 /* retirado / coletado */
    --trilha:rgba(255,255,255,.10); /* estimado (recessivo) */
    --ok:#3ad08a; --mov:#f0b429; --prog:#9ab0cc; --bad:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;color:var(--txt);font-family:'Segoe UI',Arial,sans-serif;
            background:radial-gradient(1200px 600px at 80% -10%,#163149 0%,var(--bg) 45%,var(--bg2) 100%);}
  .wrap{height:100vh;display:flex;flex-direction:column;padding:1.6vh 1.6vw 0;gap:1.1vh;}

  header{display:flex;justify-content:space-between;align-items:flex-end;flex:0 0 auto;
         border-bottom:3px solid var(--red);padding-bottom:1vh;}
  /* cabecalho: logo e titulo lado a lado, titulo como elemento dominante -
     a TV e lida de longe, entao o nome do projeto tem de bater antes do resto. */
  .brand{display:flex;flex-direction:row;align-items:center;gap:1.1vw;min-width:0;}
  .brand img{height:6.6vh;width:auto;object-fit:contain;display:block;flex:0 0 auto;}
  .brand .risco{flex:0 0 auto;width:3px;height:6.4vh;background:var(--red);border-radius:2px;opacity:.9;}
  .brand .textos{display:flex;flex-direction:column;gap:.25vh;min-width:0;}
  .brand .kicker{font-size:1.35vh;font-weight:800;color:var(--muted);letter-spacing:2.4px;text-transform:uppercase;}
  .brand .title{font-size:3.5vh;font-weight:800;letter-spacing:.2px;line-height:1;white-space:nowrap;}
  .brand .title .hl{color:var(--red);}
  .brand .sub{color:var(--muted);font-size:1.45vh;font-weight:500;}
  .clock{text-align:right;}
  .clock .t{font-size:3.6vh;font-weight:800;line-height:1;}
  .clock .d{color:var(--muted);font-size:1.5vh;margin-top:.4vh;}
  .clock .d b{color:var(--red);}
  .clock .g{color:var(--muted);font-size:1.25vh;margin-top:.3vh;opacity:.8;}

  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:1vh .9vw;flex:0 0 auto;}
  .k{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);
     border-radius:13px;padding:1.1vh .9vw;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:.25vh;}
  .k::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red);opacity:.85;}
  .k.azul::before{background:var(--dado);}
  .k .nm{font-size:1.4vh;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k .val{font-size:4.2vh;font-weight:800;line-height:1;white-space:nowrap;}
  .k .val small{font-size:1.8vh;font-weight:600;color:var(--muted);margin-left:.25vw;}
  .k .hint{font-size:1.35vh;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meter{height:1vh;background:var(--trilha);border-radius:99px;overflow:hidden;margin-top:.45vh;}
  .meter i{display:block;height:100%;background:var(--dado);border-radius:99px;}
  .chips{display:flex;gap:.45vw;margin-top:.2vh;}
  .chip{font-size:1.3vh;font-weight:700;padding:.2vh .45vw;border-radius:99px;border:1px solid var(--line);
        display:inline-flex;align-items:center;gap:.3vw;white-space:nowrap;}
  .chip b{font-size:1.45vh;}
  .dot{width:.85vh;height:.85vh;border-radius:99px;flex:0 0 auto;}
  .s-ok{color:var(--ok);}    .s-ok   .dot{background:var(--ok);}
  .s-mov{color:var(--mov);}  .s-mov  .dot{background:var(--mov);}
  .s-prog{color:var(--prog);}.s-prog .dot{background:var(--prog);}
  .s-bad{color:var(--bad);}  .s-bad  .dot{background:var(--bad);}

  main{flex:1 1 auto;display:grid;grid-template-columns:1.02fr 1.06fr 1fr;gap:1vh .9vw;min-height:0;}
  .col{display:grid;grid-template-rows:1.12fr 1fr;gap:1vh;min-height:0;}
  .box{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:1.1vh .9vw;
       display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;}
  .box h2{font-size:1.7vh;font-weight:700;letter-spacing:.3px;display:flex;justify-content:space-between;
          align-items:baseline;gap:.6vw;flex:0 0 auto;}
  .box h2 span{font-size:1.35vh;color:var(--muted);font-weight:600;white-space:nowrap;}
  .box .body{flex:1 1 auto;min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column;justify-content:space-evenly;}
  /* rodape de "resto": o que nao caber no top-N aparece contado aqui */
  .resto{flex:0 0 auto;margin-top:.5vh;padding-top:.6vh;border-top:1px dashed var(--line);
         font-size:1.35vh;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;}
  .resto[hidden]{display:none;}   /* sem isto o display:flex vence o atributo hidden */
  .resto b{color:var(--txt);}

  .row{display:grid;grid-template-columns:1fr auto;gap:.15vh .6vw;}
  .row .lb{font-size:1.55vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .lb em{font-style:normal;color:var(--muted);font-weight:600;font-size:1.35vh;margin-left:.4vw;}
  .row .vl{font-size:1.4vh;color:var(--muted);font-weight:700;text-align:right;white-space:nowrap;}
  .row .vl b{color:var(--txt);font-size:1.65vh;}
  .bar{grid-column:1/-1;height:1.35vh;background:var(--trilha);border-radius:4px;overflow:hidden;position:relative;}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--dado);border-radius:0 4px 4px 0;}
  .bar i.zero{width:0 !important;}
  .flag{font-size:1.3vh;font-weight:700;color:var(--mov);white-space:nowrap;}
  .row.soma{border-top:1px dashed var(--line);padding-top:.7vh;}
  .row.soma .lb{color:var(--muted);}

  /* mapa: agregado geografico - o unico bloco que MELHORA quando a operacao cresce */
  .mapbox{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:.6vh;margin-top:.6vh;}
  .mapbox svg{flex:1 1 auto;min-height:0;width:100%;}
  .uflist{flex:0 0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7vh .9vw;}
  .uf{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:.1vh .5vw;align-items:baseline;min-width:0;}
  .uf .sig{font-size:1.85vh;font-weight:800;letter-spacing:.5px;white-space:nowrap;}
  .uf .sig em{font-style:normal;font-size:1.25vh;color:var(--muted);font-weight:600;margin-left:.25vw;}
  .uf .nb{font-size:1.3vh;color:var(--muted);font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .uf .bar{height:1.05vh;}
  .uf.resto-uf{align-self:center;border-top:1px dashed var(--line);padding-top:.5vh;}
  .escala{display:inline-flex;align-items:center;gap:.4vw;}
  .escala i{width:5vw;height:1vh;border-radius:3px;background:linear-gradient(90deg,#1c5cab,#9ec5f4);}

  .chart{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin-top:.5vh;}
  .chart svg{width:100%;flex:1 1 auto;min-height:0;}
  .legenda{flex:0 0 auto;display:flex;gap:1vw;font-size:1.3vh;color:var(--muted);font-weight:600;margin-top:.3vh;}
  .legenda i{display:inline-block;width:1.3vh;height:1.3vh;border-radius:3px;vertical-align:-.1vh;margin-right:.3vw;}
  .vazio{color:var(--muted);font-size:1.5vh;text-align:center;margin:auto;}

  .ticker{flex:0 0 auto;height:6.6vh;margin:0 -1.6vw;border-top:1px solid var(--line);position:relative;
          background:linear-gradient(180deg,#0e1f31,#0a1522);overflow:hidden;}
  .ticker .tag{position:absolute;left:0;top:0;bottom:0;z-index:2;background:var(--red);color:#fff;font-weight:800;
               font-size:1.45vh;letter-spacing:1.2px;width:8.8vw;display:flex;flex-direction:column;
               align-items:center;justify-content:center;text-transform:uppercase;text-align:center;line-height:1.15;}
  .ticker .janela{position:absolute;left:8.8vw;right:0;top:0;bottom:0;overflow:hidden;display:flex;align-items:center;}
  .ticker .track{display:flex;align-items:center;white-space:nowrap;width:max-content;flex:0 0 auto;
                 will-change:transform;animation:roda linear infinite;}
  @keyframes roda{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .it{display:inline-flex;align-items:center;gap:.5vw;padding:0 1.5vw;font-size:1.6vh;border-right:1px solid var(--line);}
  .it .id{font-weight:800;}
  .it .rt{color:var(--muted);font-weight:600;}
  .it .pz{font-weight:800;color:var(--dado);}
  .it .st{font-weight:800;}
</style>
</head>

     <div class="lb">${p.code}<em>${p.cidade}/${p.uf}</em></div>

        <b>${n(p.ret)}</b> / ${n(p.est)} t · <span class="s-${p.cls}">${p.pct>0?n(p.pct)+"%":p.status}</span></div>
     <div class="bar" style="width:${(p.est/maxE*100).toFixed(1)}%"><i class="${p.ret?"":"zero"}"
          style="width:${(p.ret/p.est*100||0).toFixed(1)}%"></i></div>
   </div>`).join("");
  const r = D.resto_pred||{n:0};
  if(r.n>0){ const el=document.getElementById("resto-pred"); el.hidden=false;
    el.innerHTML = `<span>+ ${r.n} ${pl(r.n,"prédio","prédios")} fora do foco</span>`
                 + `<span><b>${n(r.ret)}</b> / ${n(r.est)} t</span>`; }
})();

/* ---------------- ranking por material (top-N + "Outros") ---------------- */
(function(){
  const m = D.rank||[], maxM = Math.max(...m.filter(x=>!x.soma).map(x=>x.est), 1);
  document.getElementById("rank").innerHTML = m.map(x=>
    /* a linha "Outros" e um SOMATORIO de varios tipos: vai sem barra, porque a
       largura da barra codifica o volume de UM tipo (somar mudaria o sentido). */
    x.soma ? `<div class="row soma">
       <div class="lb">${x.nome}</div>
       <div class="vl"><b>${n(x.ret)}</b> / ${n(x.est)} t</div>
     </div>`
    : `<div class="row">
       <div class="lb">${x.nome}</div>
       <div class="vl"><b>${n(x.ret)}</b> / ${n(x.est)} t</div>
       <div class="bar" style="width:${(x.est/maxM*100).toFixed(1)}%"><i class="${x.ret?"":"zero"}"
            style="width:${(x.ret/x.est*100||0).toFixed(1)}%"></i></div>
     </div>`).join("");
})();

/* ---------------- ritmo de coleta: colunas do periodo + linha acumulada ----------------
   A granularidade vem do gerador (dia -> semana -> mes), entao o grafico ocupa
   o mesmo espaco com 4 dias ou com 2 anos de operacao. Uma unica escala (t). */
(function(){
  const s = D.serie||[], svg = document.getElementById("curva");
  document.getElementById("h-gran").textContent = s.length ? ("por "+(D.gran||"dia")+" · t") : "";
  document.getElementById("lg-dia").textContent = "coletado por "+(D.gran||"dia");
  if(!s.length){ svg.parentElement.innerHTML = '<div class="vazio">Sem coleta realizada registrada ainda.</div>'; return; }
  const W=560, H=250, L=46, R=38, T=20, B=30;
  const bruto = Math.max(...s.map(p=>p.acum), 1);
  const pot = Math.pow(10, Math.floor(Math.log10(bruto/4)));
  const passo = [1,2,2.5,5,10].map(x=>x*pot).find(p=>p*4 >= bruto) || pot*10;
  const max = passo*4;
  const bw = Math.min(40, (W-L-R)/Math.max(s.length,1) * .55);
  const x = i => L + bw/2 + (W-L-R-bw) * (s.length===1 ? .5 : i/(s.length-1));
  const y = v => H-B - (H-T-B) * (v/max);
  let g="";
  for(let k=0;k<=4;k++){ const v=passo*k, yy=y(v);
    g+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#26405a" stroke-width="1"/>`
      +`<text x="${L-7}" y="${yy+4}" fill="#9ab0cc" font-size="13" text-anchor="end">${n(v,0)}</text>`; }
  /* coluna com as pontas de cima arredondadas, ancorada na linha de base */
  const col = (cx,vy,w,h,r=4)=>{ r=Math.min(r,w/2,h);
    return `<path d="M${cx-w/2},${vy+h} v${-(h-r)} a${r},${r} 0 0 1 ${r},${-r} h${w-2*r} a${r},${r} 0 0 1 ${r},${r} v${h-r} Z" fill="rgba(77,163,255,.35)"/>`; };
  /* com muitas faixas, rotula so 1 em cada k para os textos nao colidirem */
  const passo_rot = Math.ceil(s.length/8);
  let bars="", lbl="";
  s.forEach((p,i)=>{ bars += col(x(i), y(p.dia), bw, Math.max(H-B-y(p.dia),2));
    if(i%passo_rot===0 || i===s.length-1)
      lbl += `<text x="${x(i)}" y="${H-10}" fill="#9ab0cc" font-size="13" text-anchor="middle">${p.d}</text>`; });
  const pts = s.map((p,i)=>`${x(i).toFixed(1)},${y(p.acum).toFixed(1)}`);
  const area = `M${x(0).toFixed(1)},${H-B} L`+pts.join(" L")+` L${x(s.length-1).toFixed(1)},${H-B} Z`;
  const linha = s.length>1 ? `<path d="M${pts.join(" L")}" fill="none" stroke="#4da3ff" stroke-width="3"
                               stroke-linejoin="round" stroke-linecap="round"/>` : "";
  /* marcador em todos os pontos so enquanto forem poucos */
  const mk = (s.length<=14 ? s : [s[s.length-1]]).map(p=>{ const i=s.indexOf(p);
    return `<circle cx="${x(i)}" cy="${y(p.acum)}" r="5" fill="#4da3ff" stroke="#102234" stroke-width="2"/>`; }).join("");
  const ult = s[s.length-1];
  const tag = `<text x="${W-R+34}" y="${y(ult.acum)-10}" fill="#eef4fb" font-size="16" font-weight="700"
                text-anchor="end">${n(ult.acum,1)} t</text>`;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.innerHTML = g+bars+`<path d="${area}" fill="rgba(77,163,255,.14)"/>`+linha+mk+tag+lbl
    +`<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#26405a" stroke-width="1.5"/>`;
})();

/* ---------------- mapa: coropleta de UM hue (magnitude = volume estimado) ---------------- */
(function(){
  const box = document.getElementById("mapbox"), M = D.mapa||{}, ufs = D.ufs||[];
  if(!M.paths){ box.innerHTML = '<div class="vazio">Mapa não disponível.</div>'; return; }
  const porUf = {}; (D.ufs||[]).forEach(u=>porUf[u.uf]=u);
  const maxE = Math.max(...Object.values(porUf).map(u=>u.est), 1);
  /* rampa de um unico hue: escuro = pouco volume, claro = muito (fundo escuro) */
  const RAMPA = ["#1c5cab","#256abf","#2a78d6","#3987e5","#5598e7","#6da7ec","#86b6ef","#9ec5f4"];
  const cor = v => RAMPA[Math.min(RAMPA.length-1, Math.floor(Math.pow(v/maxE,.6)*RAMPA.length))];
  let paths="";
  for(const [uf,d] of Object.entries(M.paths)){
    const u = porUf[uf];
    paths += `<path id="uf-${uf}" d="${d}" fill="${u?cor(u.est):"#152b41"}" stroke="#0c1a29" stroke-width="1.4"/>`;
  }
  const maxL = Math.max(...ufs.map(u=>u.est), 1);
  const r = D.resto_uf||{n:0};
  box.innerHTML = `<svg viewBox="${M.viewBox}" id="svgmapa" preserveAspectRatio="xMidYMid meet">${paths}<g id="rotulos"></g></svg>
    <div class="uflist">` + ufs.map(u=>`
      <div class="uf">
        <div class="sig">${u.uf}<em>${u.predios} ${pl(u.predios,"frente","frentes")}</em></div>
        <div class="nb">${n(u.ret)} / ${n(u.est)} t</div>
        <div class="bar" style="width:${(u.est/maxL*100).toFixed(1)}%"><i class="${u.ret?"":"zero"}"
             style="width:${(u.ret/u.est*100||0).toFixed(1)}%"></i></div>
      </div>`).join("")
    /* a linha do "resto" e um SOMATORIO: nao leva barra, porque a largura da
       barra codifica o volume de UM estado - somar mudaria o significado. */
    + (r.n>0 ? `<div class="uf resto-uf"><div class="sig" style="color:var(--muted)">+${r.n}<em>${pl(r.n,"estado","estados")}</em></div>
        <div class="nb">${n(r.ret)} / ${n(r.est)} t</div></div>` : "")
    + `</div>`;
  /* rotulo direto nas UFs com operacao: a cor nunca carrega o dado sozinha.
     Com muitos estados no mapa, rotula apenas os maiores - a lista ao lado
     cobre o resto, e assim o mapa nao vira uma colcha de textos. */
  const rot = document.getElementById("rotulos");
  requestAnimationFrame(()=>{
    let out="", postos=[];
    /* guarda-colisao: em regiao cheia (Sudeste, DF) dois rotulos nao se sobrepoem;
       quem nao couber continua visivel na lista ao lado. */
    const livre = (x,y)=> !postos.some(p=>Math.abs(p.x-x)<64 && Math.abs(p.y-y)<44);
    ufs.slice(0,6).forEach(u=>{
      const el = document.getElementById("uf-"+u.uf); if(!el) return;
      const b = el.getBBox(), cx=b.x+b.width/2, cy=b.y+b.height/2;
      const pequeno = b.width < 42;
      const lx = pequeno ? cx+62 : cx, ly = pequeno ? cy-10 : cy+10;
      if(!livre(lx,ly)) return;
      postos.push({x:lx,y:ly});
      if(pequeno) out += `<line x1="${cx+5}" y1="${cy}" x2="${lx-30}" y2="${ly-8}" stroke="#9ab0cc" stroke-width="2"/>`;
      out += `<text x="${lx}" y="${ly}" fill="#eef4fb" font-size="34" font-weight="800" text-anchor="middle"
                stroke="#0c1a29" stroke-width="7" paint-order="stroke">${u.uf}</text>`
           + `<text x="${lx}" y="${ly+26}" fill="#cfe0f2" font-size="23" font-weight="700" text-anchor="middle"
                stroke="#0c1a29" stroke-width="7" paint-order="stroke">${n(u.est,0)} t</text>`;
    });
    rot.innerHTML = out;
  });
})();

/* ---------------- faixa rolante: janela operacional, nunca a base inteira ---------------- */
(function(){
  const t = D.ticker||[], track = document.getElementById("track");
  if(D.ticker_resto>0)
    document.getElementById("tag-ticker").innerHTML = `<span>Coletas</span><span style="font-size:1.1vh;opacity:.85;letter-spacing:.4px">+${D.ticker_resto} no histórico</span>`;
  if(!t.length){ track.innerHTML = '<div class="it"><span class="rt">Nenhuma coleta em aberto.</span></div>'; return; }
  const item = c => `<div class="it"><span class="id s-${c.cls}">${c.id}</span>
      <span class="rt">${c.data} · ${c.predio} → ${c.cd||c.uf}</span>
      <span class="pz">${n(c.ton,2)} t</span>
      <span class="rt">${c.transp||"—"}</span>
      <span class="st s-${c.cls}"><span class="dot"></span> ${c.status||ROT[c.cls]}</span></div>`;
  const uma = t.map(item).join("");
  track.innerHTML = uma+uma;
  requestAnimationFrame(()=>{
    const janela = track.parentElement.clientWidth;
    let voltas = 1;
    /* a metade da faixa precisa ser mais larga que a janela, senao o loop "pula" */
    while(track.scrollWidth/2 < janela*1.1 && voltas < 12){ voltas++; track.innerHTML = uma.repeat(voltas)+uma.repeat(voltas); }
    track.style.animationDuration = Math.max(20, (track.scrollWidth/2)/70) + "s";  /* ~70 px/s: legivel de longe */
  });
})();

/* ---------------- relogio ---------------- */
function tick(){
  const d = new Date();
  document.getElementById("hora").textContent = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById("hoje").innerHTML = "<b>"+d.toLocaleDateString('pt-BR',{weekday:'long'})+"</b>, "
    + d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
}
tick(); setInterval(tick,20000);
</script>
</body>
